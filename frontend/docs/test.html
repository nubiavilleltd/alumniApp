    window.fbAsyncInit = function() {
      FB.init({ appId: '856165983804869', cookie: true, xfbml: false, version: 'v19.0'});
    };
  
    function loginWithFacebook() {
      event.preventDefault()
      FB.login(function(response) {
        console.log('FB.login callback fired', response);
        if (response.authResponse) {
          const accessToken = response.authResponse.accessToken;

          fetch(LOGIN_URL, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-API-Key': API_KEY
            },
            body: JSON.stringify({
              provider: 'facebook',
              access_token: accessToken
            })
          })
          .then(res => res.json())
          .then(data => {
            console.log({data});            
            localStorage.setItem('data', JSON.stringify(data));
            if (data.status === 200) {
              localStorage.setItem('access_token', data.access_token);
            }
          })
          .catch(err => console.error('fetch failed', err)); // <-- add this, you're missing error handling entirely
        } else {
          console.log('No authResponse — user cancelled or denied permissions', response);
        }
      }, { scope: 'email,public_profile' });
    }
